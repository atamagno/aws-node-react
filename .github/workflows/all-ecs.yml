name: Deploy All with ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Choose development environment to deploy
        options:
          - dev
          - test
          - prod
        default: dev
      region:
        type: string
        description: Choose AWS region
        default: ap-southeast-2
      deploy_ecr:
        type: boolean
        description: Deploy new ECR image?
        required: false
        default: false
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      region:
        required: true
        type: string
      deploy_ecr:
        required: false
        type: boolean

permissions:
  id-token: write
jobs:
  deploy-infra:
    uses: ./.github/workflows/infra-ecs.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment }}
      region: ${{ github.event.inputs.region }}
      deploy_ecr: ${{ github.event.inputs.deploy_ecr }}

  deploy-frontend:
    uses: ./.github/workflows/frontend.yml
    needs: deploy-infra
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment }}
      region: ${{ github.event.inputs.region }}
