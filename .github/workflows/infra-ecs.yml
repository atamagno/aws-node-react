name: Deploy Infra ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Choose development environment to deploy
        options:
          - dev
          - test
          - prod
        default: dev
      region:
        type: string
        description: Choose AWS region
        default: ap-southeast-2
      deploy_ecr:
        type: boolean
        description: Deploy new ECR image?
        default: true
      task_count:
        type: number
        description: Number of ECS tasks to run
        default: 1
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      region:
        required: true
        type: string
      deploy_ecr:
        required: true
        type: boolean
      task_count:
        required: true
        type: number

permissions:
  id-token: write
jobs:
  deploy:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run unit tests
        working-directory: ./backend
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Running script for backend deployment
        id: deploy-backend
        working-directory: ./backend
        env:
          AWS_REGION: ${{ github.event.inputs.region }}
          ENVIRONMENT_NAME: ${{ github.event.inputs.environment }}
          DEPLOY_ECR: ${{ github.event.inputs.deploy_ecr }}
          TASK_COUNT: ${{ github.event.inputs.task_count }}
        run: |
          chmod u+x deploy-ecs.sh
          ./deploy-ecs.sh
