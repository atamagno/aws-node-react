name: Deploy Infra ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Choose development environment to deploy
        options:
          - dev
          - test
          - prod
        default: dev
      region:
        type: string
        description: Choose AWS region
        default: ap-southeast-2
      deploy_ecr:
        type: boolean
        description: Deploy new ECR image?
        required: false
        default: false
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      region:
        required: true
        type: string
      deploy_ecr:
        required: false
        type: boolean

permissions:
  id-token: write
jobs:
  deploy:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Running script for backend deployment
        id: deploy-backend
        working-directory: ./backend
        env:
          AWS_REGION: ${{ github.event.inputs.region }}
          ENVIRONMENT_NAME: ${{ github.event.inputs.environment }}
          DEPLOY_ECR: ${{ github.event.inputs.deploy_ecr }}
        run: |
          chmod u+x deploy-ecs.sh
          ./deploy-ecs.sh
