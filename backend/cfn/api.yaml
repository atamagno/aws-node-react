AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  pAppName:
    Type: String
  pEnvironmentName:
    Type: String
    Default: dev
  pDdbStackName:
    Type: String
  pGitHash:
    Type: String
  pGitBranch:
    Type: String

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs22.x
    Handler: index.handler
    Environment:
      Variables:
        THINGS_TABLE_NAME:
          Fn::ImportValue: !Sub ${pDdbStackName}-ThingsTableName

Resources:
  ApiGatewayRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${pAppName}-${pEnvironmentName}-api"
      StageName: !Sub ${pEnvironmentName}

  ThingsLambdaRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${pAppName}-${pEnvironmentName}-things-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyName: DynamoDBPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource:
                  - Fn::ImportValue: !Sub ${pDdbStackName}-ThingsTableArn
                  - !Join [
                      "/",
                      [
                        Fn::ImportValue: !Sub "${pDdbStackName}-ThingsTableArn",
                        "index/*",
                      ],
                    ]
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

  GetThingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${pAppName}-${pEnvironmentName}-get-things-lambda"
      CodeUri: ../dist/lambdas/thing/getList
      Role: !GetAtt ThingsLambdaRole.Arn
      Events:
        RestApiEvent:
          Type: Api
          Properties:
            Method: GET
            Path: /thing
            RestApiId: !Ref ApiGatewayRestApi

  AddThingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${pAppName}-${pEnvironmentName}-add-thing-lambda"
      CodeUri: ../dist/lambdas/thing/add
      Role: !GetAtt ThingsLambdaRole.Arn
      Events:
        RestApiEvent:
          Type: Api
          Properties:
            Method: POST
            Path: /thing
            RestApiId: !Ref ApiGatewayRestApi

Outputs:
  RestApiUrl:
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${pEnvironmentName}"
    Export:
      Name: !Sub ${AWS::StackName}-RestApiUrl

  ThingsLambdaRoleArn:
    Description: "ARN of the Things Lambda Role"
    Value: !GetAtt ThingsLambdaRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ThingsLambdaRoleArn

  GetThingsFunctionName:
    Description: "Name of the Get Things Lambda Function"
    Value: !Ref GetThingsFunction
    Export:
      Name: !Sub ${AWS::StackName}-GetThingsFunctionName

  GetThingsFunctionNameArn:
    Description: "ARN of the Get Things Lambda Function"
    Value: !GetAtt GetThingsFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-GetThingsFunctionNameArn

  AddThingFunctionName:
    Description: "Name of the Add Thing Lambda Function"
    Value: !Ref AddThingFunction
    Export:
      Name: !Sub ${AWS::StackName}-AddThingFunctionName

  AddThingFunctionNameArn:
    Description: "ARN of the Add Thing Lambda Function"
    Value: !GetAtt AddThingFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-AddThingFunctionNameArn

  CodeRef:
    Value: !Join ["", [!Ref pGitBranch, ".", !Ref pGitHash]]
    Description: Code Reference
    Export:
      Name: !Sub ${AWS::StackName}-CodeRef
