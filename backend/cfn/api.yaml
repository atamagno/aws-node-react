AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  pAppName:
    Type: String
  pEnvironmentName:
    Type: String
    Default: dev
  pGitHash:
    Type: String
  pGitBranch:
    Type: String

Resources:
  ApiGatewayRestApi:
    Type: "AWS::ApiGateway::RestApi"
    Properties:
      Name: !Sub "${pAppName}-${pEnvironmentName}-api"

  ApiGatewayMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: GET
      ResourceId: !GetAtt ApiGatewayRestApi.RootResourceId
      RestApiId: !Ref "ApiGatewayRestApi"
      AuthorizationType: NONE
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - { LambdaArn: !GetAtt LambdaFunctionApi.Arn }
        IntegrationResponses:
          - StatusCode: 200
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: "200"

  ApiGatewayDeployment:
    Type: "AWS::ApiGateway::Deployment"
    DependsOn: ApiGatewayMethod
    Properties:
      RestApiId: !Ref "ApiGatewayRestApi"

  ApiGatewayStageDev:
    Type: "AWS::ApiGateway::Stage"
    DependsOn: ApiGatewayDeployment
    Properties:
      RestApiId: !Ref "ApiGatewayRestApi"
      DeploymentId: !Ref "ApiGatewayDeployment"
      StageName: !Sub "${pEnvironmentName}"

  LambdaFunctionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${pAppName}-${pEnvironmentName}-api-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"

  LambdaFunctionApi:
    Type: "AWS::Lambda::Function"
    Properties:
      FunctionName: !Sub "${pAppName}-${pEnvironmentName}-api-lambda"
      Runtime: "nodejs22.x"
      Handler: "index.handler"
      Role: !GetAtt LambdaFunctionRole.Arn
      Code:
        ZipFile: |
          export const handler = async (event) => {
            // TODO implement
            const response = {
              statusCode: 200,
              body: JSON.stringify('Hello from Lambda!'),
            };
            return response;
          };

  LambdaPermissionApiGateway:
    Type: "AWS::Lambda::Permission"
    DependsOn: LambdaFunctionApi
    Properties:
      FunctionName: !GetAtt LambdaFunctionApi.Arn
      Action: "lambda:InvokeFunction"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/GET/"
      Principal: "apigateway.amazonaws.com"

Outputs:
  RestApiUrl:
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${pEnvironmentName}"
    Export:
      Name: !Sub ${AWS::StackName}-RestApiUrl

  ApiFunctionName:
    Description: "Name of the API Lambda Function"
    Value: !Ref LambdaFunctionApi
    Export:
      Name: !Sub ${AWS::StackName}-ApiFunctionName

  ApiFunctionArn:
    Description: "ARN of the API Lambda Function"
    Value: !GetAtt LambdaFunctionApi.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ApiFunctionArn
