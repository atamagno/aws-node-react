AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  pAppName:
    Type: String
    Description: Application Name deployed in this stack
  pEnvironmentName:
    Type: String
    Default: dev
    Description: The name of the specific stack deployment e.g. 'dev'
  pVpcId:
    Type: String
    Description: VPC ID for security group
  pPrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of the private subnets in the VPC
  pContainerPort:
    Type: Number
    Default: 4000
  pGitHash:
    Type: String
  pGitBranch:
    Type: String

Resources:
  VPCLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for VPC Link
      GroupName: !Sub ${pAppName}-${pEnvironmentName}-vpc-link-sg
      VpcId: !Ref pVpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${pAppName}-${pEnvironmentName}-vpc-link-sg"
        - Key: Environment
          Value: !Ref pEnvironmentName

  ELBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for ELB
      GroupName: !Sub ${pAppName}-${pEnvironmentName}-elb-sg
      VpcId: !Ref pVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref VPCLinkSecurityGroup
          Description: Allow traffic from VPC Link only

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internal
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref ELBSecurityGroup
      Subnets: !Ref pPrivateSubnetIds
      Name: !Sub "${pAppName}-${pEnvironmentName}-elb"
      Tags:
        - Key: Name
          Value: !Sub "${pAppName}-${pEnvironmentName}-elb"
        - Key: Environment
          Value: !Ref pEnvironmentName

  ELBTargetGroupA:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${pAppName}-${pEnvironmentName}-tg-a"
      VpcId: !Ref pVpcId
      TargetType: ip
      Protocol: HTTP
      IpAddressType: ipv4
      ProtocolVersion: HTTP1
      Port: !Sub ${pContainerPort}
      Targets: []
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health
      HealthCheckEnabled: true
      UnhealthyThresholdCount: 2
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub "${pAppName}-${pEnvironmentName}-tg-a"
        - Key: Environment
          Value: !Ref pEnvironmentName

  ELBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Protocol: HTTP
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      DefaultActions:
        - Type: forward
          Order: 1
          TargetGroupArn: !Ref ELBTargetGroupA

Outputs:
  VPCLinkSecurityGroupId:
    Description: VPC Link Security Group ID
    Value: !GetAtt VPCLinkSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-VPCLinkSecurityGroupId"

  ELBSecurityGroupId:
    Description: ELB Security Group ID
    Value: !GetAtt ELBSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-ELBSecurityGroupId"

  LoadBalancerName:
    Description: Load Balancer Name
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerName"

  ApplicationLoadBalancerArn:
    Description: Application Load Balancer ARN
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerArn
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationLoadBalancerArn"

  ApplicationLoadBalancerDNSName:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationLoadBalancerDNSName"

  ELBTargetGroupAArn:
    Description: ELB Target Group A ARN
    Value: !Ref ELBTargetGroupA
    Export:
      Name: !Sub "${AWS::StackName}-ELBTargetGroupAArn"

  ELBListenerArn:
    Description: ELB Listener ARN
    Value: !Ref ELBListener
    Export:
      Name: !Sub "${AWS::StackName}-ELBListenerArn"

  CodeRef:
    Value: !Join ["", [!Ref pGitBranch, ".", !Ref pGitHash]]
    Description: Code Reference
    Export:
      Name: !Sub ${AWS::StackName}-CodeRef
