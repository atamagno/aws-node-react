AWSTemplateFormatVersion: "2010-09-09"
Description: Cognito User Pool and App Client for authentication

Parameters:
  pAppName:
    Type: String
    Description: Application name
  pEnvironmentName:
    Type: String
    Default: dev
    Description: Environment name (dev, test, prod)
  pGitHash:
    Type: String
    Description: Git commit hash
  pGitBranch:
    Type: String
    Description: Git branch name
  pWebDomainName:
    Type: String
    Description: Web application domain name for callback and logout URLs

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${pAppName}-${pEnvironmentName}-user-pool"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserPoolTags:
        Name: !Sub "${pAppName}-${pEnvironmentName}-user-pool"
        Environment: !Ref pEnvironmentName
        Application: !Ref pAppName

  UserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: things-api
      Name: Things API
      UserPoolId: !Ref UserPool
      Scopes:
        - ScopeName: read
          ScopeDescription: Read access to things
        - ScopeName: write
          ScopeDescription: Write access to things

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolResourceServer
    Properties:
      ClientName: !Sub "${pAppName}-${pEnvironmentName}-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AuthSessionValidity: 3
      EnableTokenRevocation: true
      EnablePropagateAdditionalUserContextData: false
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - things-api/read
        - things-api/write
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs: [!Sub "https://${pWebDomainName}", "http://localhost:3000"]
      LogoutURLs: [!Sub "https://${pWebDomainName}", "http://localhost:3000"]
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes
      ReadAttributes:
        - email
        - name
        - email_verified
      WriteAttributes:
        - email
        - name

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::Region}-${AWS::AccountId}-${pEnvironmentName}"
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      UseCognitoProvidedValues: true
      ClientId: !Ref UserPoolClient

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolArn

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  UserPoolProviderURL:
    Description: Cognito User Pool Provider URL
    Value: !GetAtt UserPool.ProviderURL
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolProviderURL

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Ref UserPoolDomain
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolDomain

  CodeRef:
    Value: !Join ["", [!Ref pGitBranch, ".", !Ref pGitHash]]
    Description: Code Reference
    Export:
      Name: !Sub ${AWS::StackName}-CodeRef
